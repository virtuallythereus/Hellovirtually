<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace , Hello, virtually!</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#173D35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workspace">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F0EEE9'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='52' font-style='italic' font-weight='700' fill='%231F3D3A' text-anchor='middle'%3Eh%3C/text%3E%3Ccircle cx='72' cy='30' r='9' fill='%23CE3375'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#173D35; --ink-2:#2d5a4e; --ink-3:rgba(23,61,53,.58); --ink-4:rgba(23,61,53,.40); --ink-deep:#102C26;
  --paper:#F7F5F0; --paper-2:#EEECEA; --white:#ffffff;
  --coral:#F45145; --coral-soft:#e03b31; --coral-pale:#FDEFEC;
  --lav:#B9A7FF; --lav-pale:#EEE9FF;
  --blue:#C9E7F5; --blue-pale:#E8F5FC;
  --mint:#DCEBE8; --mint-2:#c8dbd7;
  --line:rgba(23,61,53,.12); --line-2:rgba(23,61,53,.06);
  --shadow:0 1px 2px rgba(23,61,53,.04),0 4px 16px rgba(23,61,53,.05);
  --shadow-md:0 2px 4px rgba(23,61,53,.05),0 8px 26px rgba(23,61,53,.07);
  --shadow-lg:0 20px 60px rgba(23,61,53,.16);
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --sidebar:234px;
  /* escala tipografica */
  --t-01:.6rem; --t-02:.7rem; --t-03:.78rem; --t-04:.875rem;
  --t-05:1rem; --t-06:1.2rem; --t-07:1.6rem; --t-08:1.9rem;
  /* radios */
  --radius-xxs:4px; --radius-lg:18px; --radius-pill:50px;
  /* movimiento */
  --anim:.18s cubic-bezier(.22,.61,.36,1);
  --anim-slow:.28s cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Helvena','Helvetica Neue',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Helvena','Helvetica Neue',sans-serif;font-weight:600;line-height:1.1;letter-spacing:-.3px;}
a{color:var(--coral);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:var(--t-04);letter-spacing:-.005em;min-height:48px;padding:0 22px;border-radius:var(--radius-pill);border:none;transition:background var(--anim),border-color var(--anim),color var(--anim);}
.btn-primary{background:var(--coral);color:var(--white);}
.hv-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:16px;box-shadow:0 2px 8px rgba(23,61,53,.15);padding:14px 18px;display:flex;align-items:center;gap:16px;font-size:.9rem;z-index:9000;max-width:calc(100vw - 32px);}
.hv-toast button{background:none;border:0;color:var(--coral);font:inherit;font-weight:500;cursor:pointer;padding:0;}
.snz-menu{position:fixed;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(23,61,53,.08);padding:6px;min-width:200px;z-index:9100;}
.snz-menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;}
.snz-menu button:hover{background:var(--mint);}
.snz-menu button.pick{border-top:1px solid var(--line);border-radius:0;color:var(--ink-3);margin-top:4px;padding-top:12px;}
.lr-sub.snz{cursor:pointer;display:inline-block;background:var(--mint);color:var(--ink);padding:4px 12px;border-radius:50px;font-size:.78rem;margin-top:4px;}
.lr-edit{font-size:.95rem;opacity:.5;}
.lr-edit:hover{opacity:1;}
.btn-primary:hover{background:var(--coral-soft);}
.btn-ghost{background:var(--white);border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);background:var(--paper-2);}
.btn-sm{min-height:44px;padding:0 18px;font-size:var(--t-03);border-radius:var(--radius-pill);}
.btn-block{width:100%;}

/* ===== SHELL ===== */
.shell{display:flex;min-height:100vh;}

/* ===== SIDEBAR ===== */
.sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--ink-deep);color:var(--paper);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;
}
.sb-brand{
  padding:30px 22px 26px;display:flex;align-items:center;gap:0;
  font-family:'Helvena','Helvetica Neue',sans-serif;font-weight:600;font-size:var(--t-04);color:var(--paper);
  letter-spacing:-.02em;line-height:1;
}
.sb-brand .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);display:inline-block;margin-left:3px;margin-bottom:8px;}
.sb-nav{flex:1;padding:0 22px;display:flex;flex-direction:column;gap:1px;}
.nav-item{
  display:flex;align-items:center;gap:12px;min-height:48px;padding:0;
  color:rgba(247,245,240,.58);font-weight:500;font-size:var(--t-04);letter-spacing:-.005em;
  cursor:pointer;transition:color var(--anim);border:none;background:none;text-align:left;width:100%;position:relative;
}
.nav-item::before{
  content:"";position:absolute;left:-22px;top:50%;width:3px;height:17px;border-radius:0 3px 3px 0;
  background:var(--coral);transform:translateY(-50%) scaleY(0);transform-origin:center;
  transition:transform var(--anim-slow);
}
.nav-item:hover{color:rgba(247,245,240,.75);}
.nav-item.active{color:var(--paper);font-weight:600;}
.nav-item.active::before{transform:translateY(-50%) scaleY(1);}
.nav-item .ic{width:17px;height:17px;flex-shrink:0;}
.nav-item .nv-badge{
  margin-left:auto;background:var(--coral);color:#fff;font-size:var(--t-01);font-weight:700;
  min-width:17px;height:17px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.sb-foot{
  margin:0;padding:18px 22px 22px;background:none;border-radius:0;
  border-top:1px solid rgba(247,245,240,.10);display:flex;align-items:center;gap:10px;
}
.sb-avatar{
  width:27px;height:27px;border-radius:50%;background:rgba(247,245,240,.12);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:var(--t-02);flex-shrink:0;
}
.sb-user{flex:1;min-width:0;}
.sb-user .e{font-size:var(--t-03);font-weight:500;color:rgba(247,245,240,.82);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-user .r{display:none;}
.sb-ico{
  background:none;border:none;color:rgba(247,245,240,.51);
  width:26px;height:26px;border-radius:var(--radius-xs);font-size:var(--t-03);font-weight:600;
  display:flex;align-items:center;justify-content:center;transition:color var(--anim),background var(--anim);
}
.sb-ico:hover{background:rgba(247,245,240,.08);color:var(--paper);}

/* ===== MAIN ===== */
.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(247,245,240,.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:none;padding:18px 28px 6px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.topbar h1{display:none;}
@media(max-width:900px){.topbar h1{display:block;font-size:var(--t-05);font-weight:600;color:var(--ink);}}
.topbar h1 em{font-style:italic;color:var(--coral);}
.tb-actions{display:flex;align-items:center;gap:8px;}
.bell{
  position:relative;background:none;border:none;
  width:34px;height:34px;border-radius:var(--radius-sm);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all var(--anim);color:var(--ink-3);
}
.bell:hover{background:rgba(23,61,53,.06);color:var(--ink);}
.tb-actions .btn-primary{background:none;border:1px solid var(--line);color:var(--ink-2);font-weight:600;}
.tb-actions .btn-primary:hover{background:var(--ink);border-color:var(--ink);color:var(--white);transform:none;box-shadow:none;}
.bell-badge{
  position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:var(--radius-pill);background:var(--coral);color:var(--white);font-size:var(--t-01);font-weight:600;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);
}
.content{padding:30px 34px 90px;max-width:1200px;width:100%;}
.view-today .main{justify-content:stretch;}
.view-today .content{max-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:0 28px 60px;}
.view-today .greet-row{text-align:center;margin-bottom:20px;}
.view-today .td-card,.view-today .focus-card{width:100%;}
@media(max-width:900px){.view-today .content{justify-content:flex-start;padding-top:8px;}}

/* ===== TODAY ===== */
.greet-row{margin-bottom:22px;}
.greet-row .hi{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-05);font-weight:600;color:var(--ink-3);letter-spacing:-.01em;}
.greet-row .date{color:rgba(23,61,53,.38);font-size:var(--t-03);margin-top:3px;}
.greet-row .hi em{font-style:italic;color:var(--coral);}
.greet-row .hi .hi-acc{display:none;}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);}
.ws-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.ws-cell.on{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral);}
.ws-cell.zero{opacity:.45;}
.ws-cell.zero:hover{opacity:.75;}
.sec-head .sec-all{background:none;border:0;font:inherit;font-size:var(--t-03);color:var(--ink-3);cursor:pointer;padding:0;}
.sec-head .sec-all:hover{color:var(--ink);}
@media(min-width:1024px){
  .tgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start;}
  .tgrid>.greet-wrap,.tgrid>.ws-strip{grid-column:1/-1;}
  .tgrid>.focus-card,.tgrid>.sec-leads{grid-column:1;}
  .tgrid>.sec-agenda{grid-column:2;grid-row:3/span 2;margin-top:0;}
}
.ws-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 13px;cursor:pointer;transition:border-color var(--anim),background var(--anim);box-shadow:var(--shadow);}
.ws-cell:hover{border-color:var(--ink);}
.ws-n{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-08);font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;}
.ws-l{font-size:var(--t-02);font-weight:500;color:var(--ink-3);letter-spacing:-.005em;line-height:1.25;}
.ws-s{font-size:var(--t-01);font-weight:600;color:var(--ink-4);margin-top:3px;font-variant-numeric:tabular-nums;}
.ws-cell.hot .ws-n{color:var(--coral);}
.ws-cell.zero{background:transparent;box-shadow:none;}
.ws-cell.zero .ws-n{color:var(--ink-4);}
@media(max-width:760px){
  .ws-strip{grid-template-columns:repeat(3,1fr);gap:6px;}
  .ws-cell{padding:11px 11px 10px;border-radius:var(--radius-sm);}
  .ws-n{font-size:var(--t-07);}
  .ws-l{font-size:var(--t-01);}
}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-h h3{font-size:var(--t-04);font-weight:700;color:var(--ink);letter-spacing:.01em;}

/* Onboarding card */
.onboard{display:flex;gap:16px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;position:relative;box-shadow:var(--shadow);}
.onboard-t::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral);margin-left:5px;margin-bottom:6px;}
.onboard-link{margin-left:auto;flex-shrink:0;font-size:var(--t-02);font-weight:600;color:var(--ink-3);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-pill);padding:7px 13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media(max-width:900px){.onboard-link{display:none;}}
.onboard-ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--lav-pale);color:var(--ink);flex-shrink:0;}
.onboard-ic svg{width:20px;height:20px;}
.onboard-main{flex:1;}
.onboard-t{font-size:var(--t-05);font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.onboard-s{font-size:var(--t-03);color:var(--ink-3);margin-top:4px;line-height:1.45;max-width:520px;}
.onboard-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}

/* Needs attention */
.attn-check{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--white);font-size:var(--t-03);font-weight:600;flex-shrink:0;}

/* Mini empty states */
.empty-mini{text-align:center;padding:20px 14px;}
.empty-mini-t{font-size:var(--t-04);font-weight:600;color:var(--ink-2);}
.empty-mini-s{font-size:var(--t-03);color:var(--ink-3);margin-top:5px;margin-bottom:14px;line-height:1.5;}

/* Section headers (used by renderTasks) */
.section-block{margin-bottom:24px;}
.section-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-h h3{font-size:var(--t-05);font-weight:600;}

/* ===== LISTS / TASK ROWS ===== */
.rowlist{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.lrow{
  display:flex;align-items:center;gap:12px;padding:13px 18px;
  border-bottom:1px solid var(--line-2);cursor:pointer;transition:background var(--anim);
}
.lrow:last-child{border-bottom:none;}
.lrow:hover{background:var(--paper-2);}
.lrow .chk{
  width:20px;height:20px;border-radius:var(--radius-xs);border:1px solid var(--line);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--white);font-size:var(--t-02);transition:all var(--anim);
}
.lrow .chk.done{background:var(--ink-2);border-color:var(--ink-2);}
.lrow .lr-main{flex:1;min-width:0;}
.lrow .lr-title{font-weight:600;font-size:var(--t-04);overflow:hidden;text-overflow:ellipsis;}
.lrow .lr-title.done{text-decoration:line-through;color:var(--ink-3);opacity:.6;}
.lrow .lr-sub{font-size:var(--t-02);color:var(--ink-3);margin-top:1px;}
.lr-when{font-size:var(--t-02);font-weight:700;color:var(--ink-3);white-space:nowrap;}
.lr-when.overdue{color:var(--coral);}
.prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.prio-high{background:var(--coral);}
.prio-normal{background:var(--lav);}
.prio-low{background:var(--line);}
.lr-right{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.lr-del{font-size:var(--t-05);line-height:1;opacity:.45;}
.lrow:hover .lr-del{opacity:1;}
.type-chip{
  font-size:var(--t-03);font-weight:600;letter-spacing:-.005em;
  padding:3px 8px;border-radius:var(--radius-pill);background:var(--mint);color:var(--ink-2);white-space:nowrap;
}

/* ===== INQUIRY CARDS ===== */
.tbl-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.search{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius-pill);
  min-height:48px;padding:0 18px;transition:border-color var(--anim);
}
.search:focus-within{border-color:var(--ink-2);}
.search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:var(--t-04);color:var(--ink);width:100%;}
.search input::placeholder{color:var(--ink-3);}

/* Filter tabs */
.filter-pills{display:flex;gap:4px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:var(--radius-pill);padding:4px;}
.fpill{
  display:inline-flex;align-items:center;font-size:var(--t-03);font-weight:600;letter-spacing:-.005em;
  min-height:44px;padding:0 16px;border-radius:var(--radius-pill);border:none;background:transparent;color:var(--ink-3);cursor:pointer;
  transition:all var(--anim);white-space:nowrap;
}
.fpill:hover{background:var(--paper-2);color:var(--ink);}
.fpill.active{background:var(--ink);color:var(--white);}
.fpill-n{font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 5px;margin-left:6px;border-radius:var(--radius-pill);background:var(--line-2);color:var(--ink-2);font-size:var(--t-01);font-weight:600;line-height:1;vertical-align:middle;}
.fpill.active .fpill-n{background:rgba(255,255,255,.22);color:var(--white);}
.inq-wait{font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 9px;border-radius:var(--radius-pill);background:var(--mint);color:var(--ink-2);font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.inq-wait.urgent{background:var(--coral-pale);color:var(--coral);border:1px solid rgba(244,81,69,.25);}

/* Inquiry card list */
.inq-list{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.inq-card{display:flex;align-items:center;gap:13px;padding:15px 20px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s;background:none;border-radius:0;box-shadow:none;}
.inq-card:last-child{border-bottom:none;}
.inq-card:hover{border-color:var(--ink-2);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.inq-av{width:6px;height:6px;border-radius:50%;flex:0 0 6px;font-size:0;overflow:hidden;background:var(--line);align-self:center;}
.inq-name{font-size:14.5px;font-weight:600;letter-spacing:-.005em;color:var(--ink);line-height:1.3;margin-bottom:0;display:flex;align-items:center;gap:6px;font-family:'Helvena','Helvetica Neue',sans-serif;}
.inq-name .nd{width:7px;height:7px;border-radius:50%;background:var(--coral);flex-shrink:0;}
.inq-qa{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.qa-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:600;min-height:48px;padding:0 17px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--white);color:var(--ink-2);cursor:pointer;transition:all var(--anim);white-space:nowrap;}
.qa-btn svg{width:14px;height:14px;}
.qa-btn:hover{border-color:var(--ink);background:var(--paper-2);color:var(--ink);}
.qa-btn.qa-primary{border-color:var(--ink);color:var(--white);background:var(--ink);}
.qa-btn.qa-primary:hover{background:var(--ink-2);border-color:var(--ink-2);color:var(--white);transform:translateY(-1px);}
.qa-btn.qa-quiet{border-color:transparent;background:transparent;color:var(--ink-3);padding-left:8px;padding-right:8px;}
.qa-btn.qa-quiet:hover{border-color:transparent;background:var(--paper-2);color:var(--ink);}

.inq-owner{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:700;letter-spacing:.02em;color:var(--ink-2);background:var(--lav-pale);border:1px solid rgba(185,167,255,.35);padding:2px 8px;border-radius:var(--radius-pill);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.inq-svc{font-size:13px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inq-sub{font-size:13px;color:var(--ink-4);margin-top:2px;}
.inq-task b{color:var(--ink-2);font-weight:700;}
.inq-right{display:flex;flex-direction:row;align-items:center;gap:8px;flex-shrink:0;font-size:12.5px;color:var(--ink-4);white-space:nowrap;text-align:right;}
@media(max-width:640px){.inq-right{flex-direction:column;align-items:flex-end;gap:6px;}}
.inq-arr{
  width:48px;height:48px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink-3);font-size:var(--t-04);
  display:flex;align-items:center;justify-content:center;transition:all var(--anim);
}
.inq-arr:hover{background:var(--ink);color:var(--white);border-color:var(--ink);}

.tick-new{background:var(--coral);}
.tick-contacting,.tick-contacted{background:var(--blue);}
.tick-estimate_sent,.tick-estimate-sent{background:var(--mint-2);}
.tick-hired,.tick-won{background:var(--ink);}
.tick-not_hired,.tick-lost{background:var(--line);}
.day{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line-2);}
.day:last-child{border-bottom:none;}
.day-d{flex:0 0 54px;text-align:center;}
.day-d .n{font-variant-numeric:tabular-nums;font-family:'Helvena','Helvetica Neue',sans-serif;font-size:23px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--ink);}
.day-d .m{font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600;}
.day.today .day-d .n{color:var(--coral);}
.day-evs{flex:1;min-width:0;}
.evt{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:12px 15px;margin-bottom:8px;}
.evt:last-child{margin-bottom:0;}
.evt.clickable{cursor:pointer;transition:border-color var(--anim);}
.evt.clickable:hover{border-color:var(--ink-3);}
.evt.done{opacity:.6;}
.evt-t{font-size:12px;color:var(--ink-4);font-weight:600;letter-spacing:.02em;}
.evt-n{font-size:14.5px;font-weight:600;margin-top:3px;color:var(--ink);letter-spacing:-.005em;}
.day-empty{font-size:13.5px;color:var(--ink-4);padding:10px 0;}
.sec{margin-top:28px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.sec-head h2{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-05);font-weight:600;letter-spacing:-.015em;color:var(--ink);}
.sec-c{font-size:13px;color:var(--ink-4);}
.inq-main{flex:1;min-width:0;}
.tw-hot{color:var(--coral);font-weight:600;}
.tw-warm{color:var(--ink);font-weight:600;}
/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:var(--radius-pill);letter-spacing:.01em;border:none;}
.pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
/* status colors */
.pill.new{background:var(--coral-pale);color:#B32418;}
.pill.new .pill-dot{background:var(--lav);}
.pill.pending{background:var(--paper-2);color:var(--ink);}
.pill.pending .pill-dot{background:var(--coral);}
.pill.ready{background:#E8F5FB;color:#14536E;}
.pill.ready .pill-dot{background:var(--blue);}
.pill.awaiting{background:var(--mint);color:var(--ink);}
.pill.awaiting .pill-dot{background:var(--ink-2);}
.pill.won,.pill.hired{background:var(--ink);color:var(--white);}
.pill.won .pill-dot,.pill.hired .pill-dot{background:var(--white);}
.pill.lost,.pill.closed,.pill.not_hired{background:transparent;border:1px solid var(--line);color:var(--ink-3);font-weight:500;}
.pill.lost .pill-dot,.pill.closed .pill-dot,.pill.not_hired .pill-dot{background:var(--line);}
/* Estimate */
.est-chip{font-variant-numeric:tabular-nums;font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:600;color:var(--ink);background:var(--mint);border:1px solid var(--mint-2);padding:2px 8px;border-radius:var(--radius-pill);white-space:nowrap;}
.est-row{display:flex;align-items:center;gap:8px;}
.est-row .est-cur{font-weight:600;color:var(--ink-3);font-size:var(--t-04);}
.est-row input{flex:1;min-width:0;max-width:180px;border:1px solid var(--line);border-radius:var(--radius-xs);padding:9px 12px;font-family:inherit;font-size:var(--t-04);font-weight:700;color:var(--ink);background:var(--white);}
.est-row input:focus{outline:none;border-color:var(--ink);}
/* Next-step chips */
.step-chips{display:flex;flex-wrap:wrap;gap:7px;}
.step-chip{display:inline-flex;align-items:center;font-family:inherit;font-size:var(--t-03);font-weight:600;min-height:48px;padding:0 18px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;transition:all var(--anim);}
.step-chip:hover{border-color:var(--ink);background:var(--paper-2);}
.step-chip.on{background:var(--ink);border-color:var(--ink);color:var(--white);}
/* Estimate doc */
.est-doc{margin-top:9px;display:flex;align-items:center;gap:10px;}
.doc-btn{display:inline-flex;cursor:pointer;}
.doc-link{font-size:var(--t-03);font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--lav);text-underline-offset:3px;}
.doc-link:hover{color:var(--coral);}





/* Tarjeta de Today */
.focus-card{max-width:620px;}

/* ===== TARJETA DE TODAY (tinta) ===== */
.td-card{
  max-width:660px;background:var(--ink);border-radius:24px;
  padding:clamp(24px,3.4vw,36px);color:var(--paper);
  box-shadow:0 1px 2px rgba(23,61,53,.06),0 18px 44px rgba(23,61,53,.13);
}
.td-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;}
.td-why{font-size:var(--t-02);font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--ink);background:var(--mint);padding:5px 13px;border-radius:var(--radius-pill);}
.td-why.late{color:#fff;background:var(--coral);}
.td-count{font-size:var(--t-03);font-weight:700;letter-spacing:.12em;color:rgba(247,245,240,.56);font-variant-numeric:tabular-nums;}
.td-sep{color:rgba(247,245,240,.22);}
.td-name{
  font-family:'Helvena','Helvetica Neue',sans-serif;
  font-size:clamp(30px,4.8vw,48px);font-weight:600;line-height:1.02;
  letter-spacing:-.035em;color:var(--paper);
}
.td-meta{font-variant-numeric:tabular-nums;display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:10px;font-size:var(--t-04);color:rgba(247,245,240,.58);}
.td-meta b{color:rgba(247,245,240,.9);font-weight:600;}
.td-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);flex-shrink:0;}
.td-x{color:rgba(247,245,240,.26);}
.td-late{color:var(--coral);font-weight:600;}
.td-warm{color:var(--paper);font-weight:600;}
.td-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;}
.td-chip{font-size:var(--t-03);color:rgba(247,245,240,.72);background:rgba(247,245,240,.08);border:1px solid rgba(247,245,240,.12);border-radius:var(--radius-xs);padding:6px 11px;line-height:1.3;}
.td-chip b{color:rgba(247,245,240,.56);font-weight:500;text-transform:capitalize;margin-right:6px;}
.td-ask{margin-top:22px;font-size:var(--t-04);line-height:1.6;color:rgba(247,245,240,.78);}
.td-svc{margin-top:14px;font-size:var(--t-05);font-weight:600;line-height:1.4;color:var(--paper);}
.td-addr{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:var(--t-04);color:rgba(247,245,240,.72);text-decoration:none;border-bottom:1px solid rgba(247,245,240,.22);padding-bottom:2px;}
.td-addr:hover{color:var(--paper);border-bottom-color:rgba(247,245,240,.5);}
.td-addr svg{width:15px;height:15px;flex:0 0 15px;opacity:.7;}
.td-ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.td-ph a{display:block;width:76px;height:76px;border-radius:var(--radius-xs);overflow:hidden;border:1px solid rgba(247,245,240,.16);}
.td-ph a:hover{border-color:rgba(247,245,240,.45);}
.td-ph img{width:100%;height:100%;object-fit:cover;display:block;}
.td-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid rgba(247,245,240,.13);}
.td-acts{display:flex;align-items:center;gap:14px;}
.td-link{display:inline-flex;align-items:center;background:none;border:none;min-height:48px;padding:0;font-family:inherit;font-size:var(--t-04);font-weight:600;color:rgba(247,245,240,.56);cursor:pointer;transition:color var(--anim);}
.td-link:hover{color:var(--paper);}
.focus-done{text-align:center;padding:34px 0 26px;}
.attn-check.big{width:54px;height:54px;font-size:var(--t-07);margin-bottom:18px;}
.focus-done-t{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-08);font-weight:600;color:var(--ink);}
.focus-done-s{font-size:var(--t-04);color:var(--ink-3);margin:8px 0 24px;}
/* Lost reason */
.lost-chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px;}
/* Confetti */
.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:400;pointer-events:none;border-radius:var(--radius-xxs);animation:confettiFall 1.6s ease-in forwards;}
@keyframes confettiFall{to{transform:translate(var(--dx,0),105vh) rotate(560deg);opacity:.85;}}
/* Message composer */
.tpl-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tpl{font-family:inherit;font-size:var(--t-02);font-weight:600;padding:7px 13px;border-radius:var(--radius-pill);
  border:1px solid var(--line);background:var(--white);color:var(--ink-3);cursor:pointer;transition:all var(--anim);}
.tpl:hover{color:var(--ink);}
.tpl.on{background:var(--ink);border-color:var(--ink);color:var(--white);}
.msg-body{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px;font-family:inherit;font-size:var(--t-04);line-height:1.55;color:var(--ink);background:var(--white);resize:vertical;}
.msg-body:focus{outline:none;border-color:var(--ink);}
".msg-ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;}
.mini-btn.send{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:600;padding:0 26px;}
.mini-btn.send:hover{background:var(--coral-soft);border-color:var(--coral-soft);color:#fff;}
.composer{margin-top:22px;}
/* dentro de la tarjeta de tinta */
.td-card .tpl{background:none;border-color:rgba(247,245,240,.17);color:rgba(247,245,240,.55);}
.td-card .tpl:hover{color:var(--paper);border-color:rgba(247,245,240,.3);}
.td-card .tpl.on{background:var(--paper);border-color:var(--paper);color:var(--ink);}
.td-card .msg-body{background:var(--paper);border:none;border-radius:16px;padding:16px 18px;min-height:auto;color:var(--ink);}
.td-card .msg-body:focus{outline:none;box-shadow:0 0 0 2px rgba(247,245,240,.35);}
.td-card .mini-btn{background:rgba(247,245,240,.08);border-color:rgba(247,245,240,.16);color:rgba(247,245,240,.78);}
.td-card .mini-btn:hover{background:rgba(247,245,240,.15);border-color:rgba(247,245,240,.3);color:var(--paper);}
.td-card .mini-btn.send{background:var(--coral);border-color:var(--coral);color:#fff;}
.td-card .mini-btn.send:hover{background:var(--coral-soft);border-color:var(--coral-soft);}
.td-card .msg-none{color:rgba(247,245,240,.5);}
.msg-none{font-size:var(--t-02);color:var(--ink-3);margin-top:6px;}
/* My form */
.form-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;max-width:860px;}
@media(max-width:900px){.form-grid{grid-template-columns:1fr;}}
.form-link-row{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 14px;}
.form-link{flex:1;min-width:0;font-size:13.5px;font-weight:400;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.form-cap{margin-top:14px;font-size:var(--t-04);color:var(--ink-3);}
.form-cap b{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-06);color:var(--ink);margin-right:4px;}
.form-hint{font-size:var(--t-03);color:var(--ink-3);line-height:1.5;margin:12px 0;}
.qr-box{display:flex;justify-content:center;background:var(--white);border:1px solid var(--line-2);border-radius:12px;padding:14px;}
.qr-box img{width:100%;max-width:220px;height:auto;image-rendering:pixelated;}
.form-hero{max-width:860px;margin:0 0 18px;}
.form-hero-t{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-06);font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.form-hero-s{font-size:var(--t-04);color:var(--ink-3);margin-top:4px;line-height:1.5;max-width:620px;}
.form-side{display:flex;flex-direction:column;gap:18px;}
.form-open-link{font-size:var(--t-02);font-weight:700;color:var(--coral);white-space:nowrap;}
.form-open-link:hover{color:var(--coral-soft);}
.device{max-width:330px;margin:4px auto 0;border:9px solid var(--ink);border-radius:30px;background:var(--ink);box-shadow:var(--shadow-md);overflow:hidden;}
.device-screen{background:var(--white);border-radius:21px;overflow:hidden;line-height:0;}
.device-screen iframe{width:100%;height:540px;border:0;display:block;background:var(--white);}
.form-tailored{margin-top:14px;font-size:var(--t-03);color:var(--ink-2);line-height:1.5;text-align:center;background:var(--mint);border:1px solid var(--mint-2);border-radius:var(--radius-sm);padding:10px 12px;}
@media(max-width:900px){.device-screen iframe{height:480px;}}
/* Results */
.res-wrap{max-width:640px;}
.res-month{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:600;letter-spacing:.14em;color:var(--ink-3);margin-bottom:6px;}
.res-row{display:flex;align-items:baseline;gap:16px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow);}
.res-idx{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-4);font-weight:500;min-width:18px;}
.res-n{font-variant-numeric:tabular-nums;font-family:'Helvena','Helvetica Neue',sans-serif;font-size:27px;font-weight:600;color:var(--ink);letter-spacing:-.03em;line-height:1;min-width:0;}
.res-l{font-size:12.5px;color:var(--ink-3);font-weight:400;}
.res-s{font-size:12px;color:var(--ink-4);margin-top:6px;}
.res-hero{background:var(--ink);border-radius:var(--radius);padding:22px;margin:6px 0;box-shadow:var(--shadow);}
.res-hero .res-n,.res-hero .res-l{color:var(--paper);}
.res-hero .res-idx{color:rgba(247,245,240,.4);}
.res-hero .res-s{color:rgba(247,245,240,.62);}
/* Monthly report */
.res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.res-mbtn{background:none;border:1px solid var(--line);border-radius:var(--radius-xs);width:30px;height:30px;font-size:var(--t-05);color:var(--ink);cursor:pointer;line-height:1;}
.res-mbtn:hover{background:var(--paper-2);}
.res-mbtn:disabled{opacity:.3;cursor:default;}
.res-sec{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-03);font-weight:600;letter-spacing:.14em;color:var(--ink-3);margin:34px 0 6px;}
.res-src{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);}
.res-src-l{font-size:var(--t-04);font-weight:600;color:var(--ink);min-width:110px;}
.res-src-bar{flex:1;height:10px;background:var(--paper-2);border-radius:var(--radius-xxs);overflow:hidden;}
.res-src-fill{height:100%;background:var(--lav);border-radius:var(--radius-xxs);}
.res-src-n{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-04);font-weight:600;color:var(--ink);min-width:22px;text-align:right;}
.res-lead{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.res-lead:hover{background:var(--paper-2);}
.res-lead-main{flex:1;min-width:0;}
.res-lead-t{font-size:var(--t-04);font-weight:600;color:var(--ink);}
.res-lead-s{font-size:var(--t-03);color:var(--ink-3);margin-top:2px;}
.res-share-wrap{margin-top:26px;}
@media(max-width:560px){.res-src-l{min-width:84px;font-size:var(--t-03);}}
@media(max-width:560px){.res-n{font-size:var(--t-08);min-width:80px;}}
/* Completed in calendar */
.cal-ev.done{opacity:.55;text-decoration:line-through;}

.cal-di.done 

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--ink-3);}
.empty .big{font-family:'Helvena','Helvetica Neue',sans-serif;font-style:italic;font-size:var(--t-06);color:var(--ink-2);margin-bottom:8px;}
.empty .hand{display:none;}

.sched-tabs{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:var(--radius-pill);margin-bottom:18px;width:fit-content;}
.sched-tab{border:none;background:none;font-family:inherit;font-size:var(--t-04);font-weight:500;color:var(--ink-3);padding:11px 22px;min-height:48px;border-radius:var(--radius-pill);cursor:pointer;transition:background var(--anim),color var(--anim);}
.sched-tab.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,61,53,.08);}
/* ===== DETAIL DRAWER ===== */
.drawer-bg{position:fixed;inset:0;background:rgba(23,61,53,.3);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;}
.drawer-bg.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:480px;max-width:92vw;
  background:var(--paper);z-index:95;box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{
  padding:20px 22px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--white);
}
.drawer-head h2{font-size:var(--t-06);font-weight:600;}
.drawer-head .dh-sub{font-size:var(--t-03);color:var(--ink-3);margin-top:4px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.drawer-close{background:none;border:none;font-size:var(--t-07);color:var(--ink-3);cursor:pointer;line-height:1;padding:2px 4px;border-radius:var(--radius-xs);transition:all var(--anim);}
.drawer-close:hover{color:var(--ink);background:var(--paper-2);}
.drawer-body{flex:1;overflow-y:auto;padding:20px 22px;background:var(--paper);overscroll-behavior:contain;}
.dsec{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow);}
.wait-pill{display:inline-flex;align-items:center;font-size:var(--t-02);font-weight:600;padding:4px 11px;border-radius:var(--radius-pill);background:var(--mint);color:var(--ink);margin-right:4px;font-variant-numeric:tabular-nums;}
.wait-pill.hot{background:var(--coral);color:#fff;}

.dsec-l{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-05);font-weight:600;letter-spacing:-.015em;text-transform:none;color:var(--ink);margin-bottom:6px;}
.dcard{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow);}
.d-hint{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px;background:var(--blue-pale);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:12px;font-size:var(--t-03);line-height:1.4;}
.d-hint.hot{background:var(--coral-pale);}
.d-hint-l{font-weight:600;color:var(--ink);}
.d-hint-d{color:var(--ink-3);}
.d-hint.hot .d-hint-l{color:var(--coral-soft);}
.d-hint.hot .d-hint-d{color:var(--coral-soft);opacity:.85;}
.d-hint-u{font-size:var(--t-01);font-weight:600;letter-spacing:.05em;background:var(--coral);color:var(--white);border-radius:var(--radius-pill);padding:2px 7px;}
.d-acts{position:sticky;bottom:0;z-index:4;display:flex;flex-wrap:nowrap;gap:8px;background:var(--paper);border-top:1px solid var(--line);margin:0 -22px -20px;padding:14px 22px 20px;}
.d-acts .dact{flex:0 0 auto;padding:0 14px;white-space:nowrap;}
.d-acts .dact.primary{flex:1 1 auto;min-width:0;padding:0 18px;overflow:hidden;text-overflow:ellipsis;}

.dact{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:var(--t-03);font-weight:600;min-height:46px;padding:0 18px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;text-decoration:none;transition:background var(--anim),border-color var(--anim),color var(--anim);}
.dact:hover{border-color:var(--ink);}
.dact.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.dact.primary:hover{background:var(--ink-deep);}
.dact.win{background:var(--mint);border-color:transparent;}
.dsplit{height:1px;background:var(--line-2);margin:16px 0 14px;}

}
.dfield{padding:13px 0;border-bottom:1px solid var(--line-2);}
.dfield:last-child{border-bottom:none;padding-bottom:0;}
.dfl{font-size:var(--t-03);color:var(--ink-3);letter-spacing:-.005em;}
.dfv{font-size:var(--t-04);color:var(--ink);margin-top:4px;line-height:1.5;word-break:break-word;}

.ph-strip{display:flex;flex-wrap:wrap;gap:8px;}

.ph-strip img{width:100%;height:100%;object-fit:cover;display:block;}



.cmp-scrim{position:absolute;inset:0;z-index:5;background:rgba(23,61,53,.28);opacity:0;pointer-events:none;transition:opacity .22s;}
.drawer.cmp-on .cmp-scrim{opacity:1;pointer-events:auto;}
.cmp-sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:82%;overflow-y:auto;background:var(--paper);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 28px rgba(23,61,53,.16);padding:10px 22px 20px;transform:translateY(101%);transition:transform .26s cubic-bezier(.4,0,.2,1);}
.drawer.cmp-on .cmp-sheet{transform:translateY(0);}
.cmp-grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px;}
.cmp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cmp-top h3{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-05);font-weight:600;color:var(--ink);}
/* Pipeline steps */

.d-pipe{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 10px;margin-bottom:12px;box-shadow:var(--shadow);}
.pipe{display:flex;gap:4px;}
.pstep{
  flex:1;position:relative;font-size:var(--t-02);font-weight:500;letter-spacing:-.005em;
  min-height:48px;padding:26px 2px 0;border:none;background:none;color:var(--ink-3);
  cursor:pointer;transition:color var(--anim);text-align:center;white-space:normal;line-height:1.25;hyphens:auto;
}
.pstep::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:50px;background:var(--line);transition:background var(--anim);}
.pstep.past::before{background:var(--ink);}
.pstep.on::before{background:var(--coral);}
.pstep.on{color:var(--coral);font-weight:600;}
.pstep:hover{border-color:var(--ink-2);color:var(--ink);}



/* Actions in drawer */
.mini-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-03);font-weight:600;
  min-height:48px;padding:0 18px;border-radius:var(--radius-pill);border:1px solid var(--line);
  background:var(--white);color:var(--ink-2);transition:all var(--anim);
}
.mini-btn:hover{border-color:var(--ink);color:var(--ink);}
.mini-btn.done{background:var(--ink);border-color:var(--ink);color:var(--white);}
.mini-btn.alt{border-color:var(--line);color:var(--ink-2);}
.mini-btn.alt:hover{border-color:var(--ink);color:var(--ink);}
.del-link{background:none;border:none;color:var(--coral);font-weight:700;font-size:var(--t-02);cursor:pointer;transition:opacity var(--anim);}
.del-link:hover{opacity:.7;}

/* Notes */
.note{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px;}
.note .nmeta{display:flex;align-items:center;gap:7px;font-size:var(--t-03);color:var(--ink-3);margin-bottom:4px;}
.who-tag{font-weight:600;letter-spacing:-.005em;padding:2px 7px;border-radius:var(--radius-pill);font-size:var(--t-03);}
.who-tag.admin{background:var(--ink);color:var(--white);}
.who-tag.client{background:var(--lav-pale);color:var(--ink);border:1px solid rgba(185,167,255,.3);}
.note .nbody{font-size:var(--t-04);line-height:1.5;}
.note .nmeta .ntime{margin-left:auto;font-size:var(--t-01);color:var(--ink-4);font-variant-numeric:tabular-nums;white-space:nowrap;}
.note.sysnote{background:var(--paper);border-color:var(--line-2);}
.ch-tag{font-size:var(--t-01);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:var(--radius-pill);color:var(--ink);}
.ch-tag.ch-wa{background:var(--mint);}
.ch-tag.ch-sms{background:var(--blue-pale);}
.ch-tag.ch-mail{background:var(--lav-pale);}
.ch-tag.ch-tel{background:var(--ink);color:var(--paper);}
.nsys-l{font-size:var(--t-02);color:var(--ink-3);}
.nquote{margin-top:7px;padding:9px 12px;background:var(--white);border:1px solid var(--line-2);border-left:2px solid var(--line);border-radius:var(--radius-xs);font-size:var(--t-03);line-height:1.5;color:var(--ink-2);white-space:pre-wrap;}
.note.syslog{display:flex;align-items:center;gap:9px;background:transparent;border:none;padding:5px 2px;margin-bottom:2px;}
.sysdot{width:5px;height:5px;border-radius:50%;background:var(--ink-4);flex-shrink:0;}
.syst{font-size:var(--t-02);color:var(--ink-3);}
.note.syslog .ntime{margin-left:auto;font-size:var(--t-01);color:var(--ink-4);font-variant-numeric:tabular-nums;}
.note-ctrls{margin-left:auto;display:flex;gap:8px;}
.note-edit{color:var(--ink-2);cursor:pointer;font-weight:700;font-size:var(--t-02);}
.note-del{color:var(--coral);cursor:pointer;font-weight:700;font-size:var(--t-02);}
.note-add{display:flex;gap:8px;margin-top:10px;}
.note-add input{
  flex:1;font-family:inherit;font-size:var(--t-04);padding:9px 13px;
  border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--white);outline:none;
  transition:border-color var(--anim);
}
.note-add input:focus{border-color:var(--ink-2);}
.lrow .lr-sub.reminder{font-size:var(--t-02);color:var(--ink-2);}

/* ===== MODALS ===== */
.overlay{
  position:fixed;inset:0;background:rgba(23,61,53,.35);backdrop-filter:blur(4px);
  z-index:100;display:none;align-items:flex-start;justify-content:center;
  padding:6vh 16px;overflow-y:auto;
}
.overlay.open{display:flex;}
.sheet{
  background:var(--white);border-radius:var(--radius-lg);width:100%;max-width:460px;
  padding:26px;box-shadow:var(--shadow-lg);
}
.sheet h3{font-size:var(--t-06);font-weight:600;margin-bottom:3px;}
.sheet .sub{font-size:var(--t-03);color:var(--ink-3);margin-bottom:16px;}
.sheet-close{float:right;background:none;border:none;font-size:var(--t-07);color:var(--ink-3);cursor:pointer;padding:2px;}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fld label{font-size:var(--t-01);font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);}
.fld input,.fld select,.fld textarea{
  font-family:inherit;font-size:var(--t-04);padding:10px 13px;
  border-radius:var(--radius-xs);border:1px solid var(--line);background:var(--paper);
  color:var(--ink);outline:none;transition:border-color var(--anim);
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink-2);}
.fld textarea{resize:vertical;min-height:68px;}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.form-msg{font-size:var(--t-03);min-height:17px;margin-top:3px;}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.seg button{
  flex:1;font-size:var(--t-02);font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:9px;border-radius:var(--radius-xs);border:1px solid var(--line);
  background:var(--white);color:var(--ink-3);transition:all var(--anim);
}
.seg button.on{background:var(--ink);color:var(--white);border-color:var(--ink);}

/* ===== NOTIFICATIONS PANEL ===== */
.notif-panel{
  position:fixed;top:64px;right:20px;width:360px;max-width:calc(100vw - 28px);
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-lg);z-index:80;display:none;overflow:hidden;
}
.notif-panel.open{display:block;}
.notif-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.push-card{margin:10px 12px 2px;padding:11px 13px;background:var(--lav-pale);border:1px solid var(--lav);border-radius:var(--radius);display:flex;flex-direction:column;gap:9px;}
.push-card .push-tx{font-size:var(--t-04);line-height:1.45;color:var(--ink);}
.push-card .push-tx.push-ok{color:var(--ink-2);font-weight:600;}
.push-card .btn{align-self:flex-start;}
.notif-head h4{font-size:var(--t-05);font-weight:700;}
.notif-list{max-height:56vh;overflow-y:auto;}
.ngroup{position:sticky;top:0;z-index:1;background:var(--paper);padding:8px 18px 6px;font-size:var(--t-01);font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4);border-bottom:1px solid var(--line-2);}
.nrow{padding:12px 16px 12px 18px;border-bottom:1px solid var(--line-2);display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:background var(--anim);}
.nrow:hover{background:var(--paper);}
.nrow:last-child{border-bottom:none;}
.nrow .ndot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--ink-4);}
.nrow .ndot.n-new{background:var(--coral);}
.nrow .ndot.n-note{background:var(--lav);}
.nrow .ndot.n-appt{background:var(--blue);}
.nrow .ndot.n-rem{background:var(--ink-2);}
.nrow .ndot.n-rem.late{background:var(--coral);}
.nrow.read .ndot{background:var(--line);}
.nrow.read .nt{font-weight:500;color:var(--ink-3);}
.nmain{min-width:0;flex:1;}
.nrow .nt{font-size:var(--t-04);font-weight:600;letter-spacing:-.01em;line-height:1.3;}
.nrow .ns{font-size:var(--t-02);color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ntime{font-size:var(--t-01);color:var(--ink-4);flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums;}
.nrow .nx{flex-shrink:0;border:none;background:none;color:var(--ink-4);font-size:var(--t-04);line-height:1;padding:2px 0 2px 8px;cursor:pointer;opacity:0;transition:opacity var(--anim),color var(--anim);}
.nrow:hover .nx{opacity:.7;}
.nrow .nx:hover{color:var(--coral);opacity:1;}
@media(hover:none){ .nrow .nx{opacity:.5;} }
.notif-empty{padding:28px 18px;text-align:center;color:var(--ink-3);font-size:var(--t-04);}

/* ===== CALENDAR ===== */
.calendar-wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-head h3{font-size:var(--t-05);font-weight:600;}
.cal-nav{display:flex;gap:6px;}
.cal-nav button{
  width:32px;height:32px;border-radius:var(--radius-xs);
  border:1px solid var(--line);background:var(--white);color:var(--ink);
  font-size:var(--t-05);display:flex;align-items:center;justify-content:center;
  transition:all var(--anim);
}
.cal-nav button:hover{border-color:var(--ink);background:var(--paper-2);}







.cal-ev.rem{background:var(--mint);color:var(--ink-2);}



.cal-di.clickable{cursor:pointer;border-radius:var(--radius-xs);margin:0 -8px;padding-left:8px;padding-right:8px;transition:background var(--anim);}
.cal-di.clickable:hover{background:var(--paper-2);}

.cal-di.clickable:hover .cal-di-arr{color:var(--coral);}

/* ===== CLIENTS ===== */
.cl-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.cl-stat{background:var(--ink);color:var(--white);border-radius:var(--radius);padding:18px 20px;}
.cl-stat .n{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-08);font-weight:400;}
.cl-stat .cl-stat .l{font-size:var(--t-03);font-weight:400;letter-spacing:-.005em;opacity:.7;margin-top:5px;}
.client-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:12px;transition:border-color var(--anim);}
.client-card:hover{border-color:var(--ink-2);}
.client-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.client-name{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-05);font-weight:600;}
.client-email{font-size:var(--t-03);color:var(--ink-3);margin-top:2px;}
.cl-items{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}

.cl-mrr{font-family:'Helvena','Helvetica Neue',sans-serif;font-size:var(--t-06);color:var(--coral);}

.cl-notes{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.cl-notes .nh{font-size:var(--t-05);font-weight:600;letter-spacing:-.01em;color:var(--ink-3);margin-bottom:9px;}
.cl-note{background:var(--paper);border-radius:var(--radius-xs);padding:8px 12px;margin-bottom:7px;font-size:var(--t-04);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.cl-note-time{font-size:var(--t-03);color:var(--ink-3);margin-top:3px;}
.cl-note-ctrls{display:flex;gap:8px;flex-shrink:0;}
.cl-note .x{color:var(--ink-2);cursor:pointer;font-weight:700;font-size:var(--t-02);opacity:.7;}

.cl-note .x.del{color:var(--coral);}
.cl-note-add{display:flex;gap:8px;margin-top:8px;}

.cl-loading{text-align:center;padding:48px;color:var(--ink-3);}
.cl-status{font-size:var(--t-03);font-weight:600;letter-spacing:-.005em;padding:4px 10px;border-radius:var(--radius-pill);}
.cl-status.active,.cl-status.trialing{background:var(--mint);color:var(--ink-2);}
.cl-status.past_due,.cl-status.unpaid{background:var(--coral-pale);color:var(--coral);}
.cl-status.canceled{background:var(--paper-2);color:var(--ink-3);}

.gate-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper);}

  async function composerSend(id,ch,txt,btn){
    const r=inquiries.find(x=>String(x.id)===String(id)); if(!r) return;
    const ct=contactOf(r);
    if(ch==="copy"){
      try{ await navigator.clipboard.writeText(txt); btn.textContent=T("contactCopied"); setTimeout(()=>{btn.textContent=T("copyShort");},1500); }
      catch(err){ prompt("",txt); }
      return;
    }
    const sent=(txt||"").trim().slice(0,600);
    if(ch==="wa"){ window.open("https://wa.me/"+ct.ph.replace(/^\+/,"")+"?text="+encodeURIComponent(txt),"_blank"); autoNote(id,"WhatsApp \u00b7 "+sent); }
    else if(ch==="sms"){ window.location.href="sms:"+ct.ph+"?&body="+encodeURIComponent(txt); autoNote(id,"SMS \u00b7 "+sent); }
    else if(ch==="tel"){ window.location.href="tel:"+ct.ph; autoNote(id,"Call \u00b7 "+T("noteCall")); }
    else if(ch==="mail"){ window.location.href="mailto:"+ct.em+"?subject="+encodeURIComponent(T("mailSubj"))+"&body="+encodeURIComponent(txt); autoNote(id,"Email \u00b7 "+sent); }
    const curSt=stOf(r);
    const wasNew=(curSt==="new");
    const tplUsed=((composerOpen!==null&&String(composerOpen)===String(id))&&composerTpl)?composerTpl:composerDefTpl(r);
    let advTo=null;
    if(curSt==="new") advTo="contacting";
    else if(ch!=="tel"&&curSt==="contacting"&&tplUsed==="estimate"&&readyToSend(r)) advTo="estimate_sent";
    markFirstResponse(id);
    if(advTo){ const ok=await patchInq(id,statusPatch(id,advTo)); if(ok) autoNote(id,T("noteStatus")+" "+stLbl(advTo)); }
    composerReset();
    closeCmp();
    if(detailId) openDetail(detailId,true);
    render();
    if(wasNew&&ch!=="copy"&&!nextActionFor(id)){
      setTimeout(()=>{ openSchedule(id); $("schedSub").textContent=T("schedAfterSend"); applyPreset("estimate"); },500);
    }
  }

  let toastTimer=null;
  function toast(msg,undoFn,commitFn,ms){
    if(toastTimer){ clearTimeout(toastTimer.t); if(toastTimer.commit)toastTimer.commit(); }
    const old=document.querySelector(".hv-toast"); if(old)old.remove();
    const el=document.createElement("div"); el.className="hv-toast";
    el.innerHTML='<span></span><button type="button">'+esc(T("undo"))+'</button>';
    el.querySelector("span").textContent=msg;
    document.body.appendChild(el);
    const close=()=>{ el.remove(); toastTimer=null; };
    const t=setTimeout(()=>{ if(commitFn)commitFn(); close(); }, ms||5000);
    toastTimer={t:t,commit:commitFn};
    el.querySelector("button").onclick=()=>{ clearTimeout(t); if(undoFn)undoFn(); close(); };
  }

          '<span class="pill '+lv+'"><span class="pill-dot"></span>'+esc(liveLbl(lv))+'</span>'+

          waitBadge+
          '<button class="inq-arr" data-open="'+r.id+'" aria-label="Open">&#8594;</button>'+

    }

  function renderInquiries(){

    const cnt=(k)=>rInq.filter(r=>k==="closed"?(liveState(r)==="hired"||liveState(r)==="not_hired"):liveState(r)===k).length;
    const FILTS=["new","pending","ready","awaiting","closed"];
    let html='<div class="tbl-toolbar"><div class="search"><span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span><input type="text" id="searchInput" placeholder="'+esc(T("search"))+'" value="'+esc(search)+'"></div>'+
      '<div class="filter-pills">'+
        pill2("all",T("live_all"),rInq.length)+FILTS.filter(k=>cnt(k)>0||inqFilter===k).map(k=>pill2(k,T("live_"+k),cnt(k))).join("")+(archived.length?pill2("archived",T("archivedLbl"),archived.length):"")+
      '</div></div>';

    else { list=list.filter(r=>!r.archived); if(inqFilter!=="all") list=list.filter(r=>inqFilter==="closed"?(liveState(r)==="hired"||liveState(r)==="not_hired"):liveState(r)===inqFilter); }

  function renderTasks(){
    const c=$("content");
    let html='<div class="tbl-toolbar"><button class="btn btn-primary btn-sm" id="openTask">'+esc(T("addTask"))+'</button></div>';
    const open=tasks.filter(t=>!t.done), openR=reminders.filter(r=>!r.done);
    const doneAll=tasks.filter(t=>t.done).map(t=>({_k:"task",d:t.due_at?new Date(t.due_at).getTime():0,o:t})).concat(reminders.filter(r=>r.done).map(r=>({_k:"rem",d:new Date(r.due_at).getTime(),o:r}))).sort((a,b)=>b.d-a.d);

    c.innerHTML=html; $("openTask").onclick=()=>{ setAddKind("task"); openOverlay("addOverlay"); };

  // ===== CALENDAR =====
  let calRef=new Date();
  function calEvents(){ const map={}; const add=(d,ev)=>{ if(!d)return; const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); (map[k]=map[k]||[]).push(ev); };
    inquiries.forEach(r=>{ if(r.kind==="booking"&&r.booking_at) add(new Date(r.booking_at),{type:"booking",title:r.customer_name||T("booking"),time:r.booking_at,inqId:r.id}); });
    reminders.forEach(r=>{ add(new Date(r.due_at),{type:"rem",title:r.title,time:r.due_at,done:!!r.done,eid:r.id,ekind:"rem"}); });
    tasks.forEach(t=>{ if(t.due_at) add(new Date(t.due_at),{type:"rem",title:t.title,time:t.due_at,done:!!t.done,eid:t.id,ekind:"task"}); });
    return map; }
  function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
  function renderCalendar(){
    const evs=calEvents(); const start=weekStart(calRef); const today=new Date();
    const dows=lang==="es"?["Dom","Lun","Mar","Mi\u00e9","Jue","Vie","S\u00e1b"]:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const end=new Date(start); end.setDate(start.getDate()+6);
    const sameMonth=start.getMonth()===end.getMonth();
    const range=start.toLocaleDateString(locale(),{month:"short",day:"numeric"})+" \u2013 "+end.toLocaleDateString(locale(),sameMonth?{day:"numeric"}:{month:"short",day:"numeric"});
    const evLabel=x=>x.type==="booking"?T("evVisit"):(x.ekind==="task"?T("evTask"):T("evReminder"));
    let days="";
    for(let i=0;i<7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
      const list=(evs[k]||[]).slice().sort((x,y)=>new Date(x.time)-new Date(y.time));
      const isToday=d.toDateString()===today.toDateString();
      const evHTML=list.length
        ? list.map(x=>{
            const t=new Date(x.time).toLocaleTimeString(locale(),{hour:"numeric",minute:"2-digit"});
            const attr=x.eid?' data-edit="'+x.eid+'" data-ekind="'+x.ekind+'"':(x.inqId?' data-open="'+x.inqId+'"':'');
            return '<div class="evt'+(x.done?" done":"")+(attr?" clickable":"")+'"'+attr+'>'+
              '<div class="evt-t">'+esc(t)+' \u00b7 '+esc(evLabel(x))+'</div>'+
              '<div class="evt-n">'+(x.done?"\u2713 ":"")+esc(x.title)+'</div></div>';
          }).join("")
        : '<div class="day-empty">'+esc(T("nothingBooked"))+'</div>';
      days+='<div class="day'+(isToday?" today":"")+'"><div class="day-d"><div class="n">'+d.getDate()+'</div><div class="m">'+esc(dows[d.getDay()])+'</div></div><div class="day-evs">'+evHTML+'</div></div>';
    }
    $("content").innerHTML='<div class="cal-head"><h3>'+esc(range)+'</h3><div class="cal-nav"><button data-cal="prev" aria-label="prev">\u2039</button><button data-cal="today">'+esc(T("calToday"))+'</button><button data-cal="next" aria-label="next">\u203a</button></div></div><div class="calendar-wrap">'+days+'</div>';
  }

  // ===== EDIT TASK/REMINDER =====
  let editId=null,editKind=null;
  function openEdit(kind,id){

  // ===== RESULTS =====
  let resM=0; // 0 = mes actual, -1 = mes anterior...
  function renderResults(){
    const c=$("content"); const now=new Date();
    const base=new Date(now.getFullYear(),now.getMonth()+resM,1);
    const y=base.getFullYear(),m=base.getMonth();
    const pv=new Date(y,m-1,1); const py=pv.getFullYear(),pm=pv.getMonth();
    const inMo=(d,yy,mm)=>{ if(!d)return false; const t=new Date(d); return t.getFullYear()===yy&&t.getMonth()===mm; };
    const wonDate=r=>r.won_at||r.updated_at;
    const real=inquiries.filter(r=>r.kind!=="booking");

    const capList=real.filter(r=>inMo(r.created_at,y,m));
    const cap=capList.length;
    const capPrev=real.filter(r=>inMo(r.created_at,py,pm)).length;
    const won=real.filter(r=>stOf(r)==="hired"&&inMo(wonDate(r),y,m));
    const wonSum=won.reduce((a,r)=>a+(parseFloat(r.estimate_amount)||0),0);
    const wonPrev=real.filter(r=>stOf(r)==="hired"&&inMo(wonDate(r),py,pm)).length;
    const out=real.filter(r=>!r.archived&&stOf(r)==="estimate_sent");
    const outSum=out.reduce((a,r)=>a+(parseFloat(r.estimate_amount)||0),0);
    const h=real.filter(r=>stOf(r)==="hired").length, nh=real.filter(r=>stOf(r)==="not_hired").length;
    const rate=(h+nh)>0?Math.round(h/(h+nh)*100)+"%":"\u2014";

    const resp=capList.map(r=>{ const fr=r.first_response_at||r.called_at; return fr?new Date(fr)-new Date(r.created_at):null; }).filter(v=>v!=null&&v>=0);
    const fmtDur=ms=>{ const hh=ms/36e5; if(hh<1)return Math.max(1,Math.round(ms/6e4))+"min"; if(hh<48)return (Math.round(hh*10)/10)+"h"; return Math.round(hh/24)+T("resDays"); };
    const speed=resp.length?fmtDur(resp.reduce((a,b)=>a+b,0)/resp.length):"\u2014";

    const monthName=base.toLocaleDateString(locale(),{month:"long",year:"numeric"});
    const pvName=pv.toLocaleDateString(locale(),{month:"long"});
    const delta=(cur,prev)=>{ const d=cur-prev; return T("resVs")+" "+pvName+": "+prev+(d!==0?" \u00b7 "+(d>0?"+":"")+d:""); };
    const row=(i,n,l,sub,hero)=>'<div class="res-row'+(hero?' res-hero':'')+'"><span class="res-idx">'+i+'</span><span class="res-n">'+n+'</span><div class="res-main"><div class="res-l">'+esc(l)+'</div>'+(sub?'<div class="res-s">'+esc(sub)+'</div>':'')+'</div></div>';

    const srcs={}; capList.forEach(r=>{ const k=(r.channel||"").trim()||T("resOther"); srcs[k]=(srcs[k]||0)+1; });
    const sEntries=Object.entries(srcs).sort((a,b)=>b[1]-a[1]);
    const sMax=sEntries.length?sEntries[0][1]:1;
    let srcHtml="";
    if(sEntries.length){
      srcHtml='<div class="res-sec">'+esc(T("resSources"))+'</div>'+sEntries.map(([k,n])=>'<div class="res-src"><span class="res-src-l">'+esc(k)+'</span><div class="res-src-bar"><div class="res-src-fill" style="width:'+Math.round(n/sMax*100)+'%"></div></div><span class="res-src-n">'+n+'</span></div>').join("");
    }

    let followHtml="";
    if(resM===0&&out.length){
      const rows=out.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).slice(0,5).map(r=>{
        const days=Math.max(0,Math.floor((now-new Date(r.created_at))/864e5));
        const amt=parseFloat(r.estimate_amount)>0?'<span class="est-chip">'+fmtMoney(r.estimate_amount)+'</span>':'';
        return '<div class="res-lead" data-open="'+r.id+'"><div class="res-lead-main"><div class="res-lead-t">'+esc(r.customer_name||"\u2014")+'</div><div class="res-lead-s">'+esc(stLbl(stOf(r)))+' \u00b7 '+days+T("resDays")+'</div></div>'+amt+'</div>';
      }).join("");
      followHtml='<div class="res-sec">'+esc(T("resFollow"))+'</div>'+rows;
    }

    const allWon=real.filter(r=>stOf(r)==="hired");
    const allWonSum=allWon.reduce((a,r)=>a+(parseFloat(r.estimate_amount)||0),0);

    const rows=[[cap,T("resCaptured"),delta(cap,capPrev)]];
    if(resM===0) rows.push([out.length,T("resOut"),outSum>0?fmtMoney(outSum)+" "+T("resOutSub"):T("resOutSub")]);
    rows.push([won.length,T("resWon"),(wonSum>0?fmtMoney(wonSum)+" \u00b7 ":"")+delta(won.length,wonPrev),1]);
    rows.push([rate,T("resRate"),""]);
    rows.push([speed,T("resSpeed"),""]);
    let ri=0; const num=()=>String(++ri).padStart(2,"0");
    const rowsHtml=rows.map(r=>row(num(),r[0],r[1],r[2],r[3])).join("");

    c.innerHTML='<div class="res-wrap">'+
      '<div class="res-head"><button class="res-mbtn" id="resPrev">&#8592;</button><div class="res-month" style="margin-bottom:0">'+esc(monthName)+'</div><button class="res-mbtn" id="resNext"'+(resM>=0?" disabled":"")+'>&#8594;</button></div>'+
      (cap===0?'<div class="res-s" style="padding:14px 2px">'+esc(T("resNoMonth"))+'</div>':'')+
      rowsHtml+
      srcHtml+followHtml+
      '<div class="res-share-wrap"><button class="btn btn-primary btn-sm" id="resShare">'+esc(T("resShare"))+'</button></div>'+
      '<div class="res-sec">'+esc(T("resAllTime"))+'</div>'+
      row(num(),real.length,T("resAllCaptured"),"")+
      row(num(),allWon.length,T("resAllWon"),allWonSum>0?fmtMoney(allWonSum):"")+
    '</div>';

    const pb=$("resPrev"),nb=$("resNext"),shb=$("resShare");
    if(pb)pb.addEventListener("click",()=>{ resM--; renderResults(); });
    if(nb)nb.addEventListener("click",()=>{ if(resM<0){ resM++; renderResults(); } });
    if(shb)shb.addEventListener("click",async()=>{
      const lines=["Hello, Virtually \u2014 "+T("resReport")+" \u00b7 "+monthName,
        cap+" "+T("resCaptured")];
      if(resM===0) lines.push(out.length+" "+T("resOut")+(outSum>0?" ("+fmtMoney(outSum)+" "+T("resOutSub")+")":""));
      lines.push(won.length+" "+T("resWon")+(wonSum>0?" \u00b7 "+fmtMoney(wonSum):""),
        T("resRate")+": "+rate,
        T("resSpeed")+": "+speed);
      const txt=lines.join("\n");
      if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){} }
      try{ await navigator.clipboard.writeText(txt); shb.textContent=T("resCopied"); setTimeout(()=>{shb.textContent=T("resShare");},1600); }catch(e){ prompt("",txt); }
    });
  }

    // needs-attention: mark reminder/task done
    const edRow=e.target.closest("[data-task]"); if(edRow&&!e.target.closest("[data-act]")){
      const rk=edRow.getAttribute("data-tkind"), rid=edRow.getAttribute("data-task");

  // ===== notifications =====
  function buildNotifs(){
    notifs=[]; const now=Date.now(); const D=864e5; const myRole=isAdmin?"admin":"client";
    inquiries.forEach(r=>{
      const c=new Date(r.created_at).getTime();
      if(r.kind!=="booking"&&stOf(r)==="new"&&!r.archived&&(now-c)<14*D)
        notifs.push({id:"inq-"+r.id,type:"new",t:T("notifNew"),s:(r.customer_name||T("noName"))+(isAsap(r)?" \u00b7 "+T("asapLbl"):""),at:c,inq:r.id});
      if(r.kind==="booking"&&r.booking_at){
        const b=new Date(r.booking_at).getTime();
        if(b>now&&(b-now)<48*36e5) notifs.push({id:"appt-"+r.id,type:"appt",t:T("notifAppt"),s:(r.customer_name||"")+" \u00b7 "+fmtWhen(r.booking_at),at:Math.min(b,now),inq:r.inquiry_id||null});
      }
    });
    const dueItem=(x,kind)=>{
      if(x.done||!x.due_at) return;
      const due=new Date(x.due_at).getTime();
      if(due-now>=12*36e5) return;
      notifs.push({id:kind+"-"+x.id,type:"rem",t:due<now?T("notifOver"):T("notifRem"),s:(x.title||"")+" \u00b7 "+fmtWhen(x.due_at),at:Math.min(due,now),inq:x.inquiry_id||null,late:due<now});
    };
    reminders.forEach(x=>dueItem(x,"rem"));
    tasks.forEach(x=>dueItem(x,"task"));
    Object.keys(notesByInq).forEach(iid=>{
      const inq=inquiries.find(x=>x.id===iid);
      (notesByInq[iid]||[]).forEach(n=>{
        if(!n.author_role||n.author_role===myRole||n.author_role==="system") return;
        const at=new Date(n.created_at).getTime();
        if((now-at)>14*D) return;
        notifs.push({id:"note-"+n.id,type:"note",t:T("notifNote"),s:(inq?(inq.customer_name||inq.client_email||""):"")+" \u00b7 "+(n.body||"").slice(0,50),at:at,inq:iid});
      });
    });
    notifs=notifs.filter(n=>!notifDeleted[n.id]);
    notifs.sort((a,b)=>(isUnread(b)-isUnread(a))||(b.at-a.at));
    notifs=notifs.slice(0,40);
    updateBadge();
  }
  function isUnread(n){ return !notifRead[n.id]; }
  function updateBadge(){ const u=notifs.filter(isUnread).length; const b=$("bellBadge"); if(u>0){ b.style.display="flex"; b.textContent=u>9?"9+":u; } else b.style.display="none"; }
  function saveNotifState(){ try{ localStorage.setItem("hv_nread_"+user.id,JSON.stringify(notifRead)); localStorage.setItem("hv_ndel_"+user.id,JSON.stringify(notifDeleted)); }catch(e){} }
  function dayLabel(ts){
    const d=new Date(ts), n=new Date();
    if(d.toDateString()===n.toDateString()) return T("today");
    const y=new Date(n); y.setDate(n.getDate()-1);
    if(d.toDateString()===y.toDateString()) return T("yesterday");
    return d.toLocaleDateString(locale(),{month:"short",day:"numeric"});
  }
  function renderNotifs(){
    const list=$("notifList"); if(!list)return;
    if(!notifs.length){ list.innerHTML='<div class="notif-empty">'+esc(T("noNotif"))+'</div>'; return; }
    let html="", lastDay=null;
    notifs.forEach(n=>{
      const dl=dayLabel(n.at);
      if(dl!==lastDay){ html+='<div class="ngroup">'+esc(dl)+'</div>'; lastDay=dl; }
      const hm=new Date(n.at).toLocaleTimeString(locale(),{hour:"numeric",minute:"2-digit"});
      html+='<div class="nrow'+(isUnread(n)?'':' read')+'" data-nid="'+esc(n.id)+'">'+
        '<span class="ndot n-'+esc(n.type)+(n.late?' late':'')+'"></span>'+
        '<div class="nmain"><div class="nt">'+esc(n.t)+'</div><div class="ns">'+esc(n.s)+'</div></div>'+
        '<span class="ntime">'+esc(hm)+'</span>'+
        '<button class="nx" data-nact="del" aria-label="dismiss">\u00d7</button>'+
      '</div>';
    });
    list.innerHTML=html;
  }

  // ===== PWA + Web Push (alertas de leads nuevos) =====
  const VAPID_PUBLIC="BKnLHh7rYG3aVN_k80Ih_kKrmJlNR2sixxDsC5YLz9Wv0N7HUg7dWgqsIX0v-zYIJfdPJe7owoP8uYPjvl5fc04";
  if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); }); }
  function isIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1); }
  function isStandalone(){ try{ return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true; }catch(e){ return false; } }
  function pushSupported(){ return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window; }
  function ub64(s){ const pad="=".repeat((4-s.length%4)%4); const b=(s+pad).replace(/-/g,"+").replace(/_/g,"/"); const raw=atob(b); const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i); return arr; }
  async function currentPushSub(){ try{ const reg=await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); }catch(e){ return null; } }
  async function enablePush(){
    try{
      const perm=await Notification.requestPermission();
      if(perm!=="granted"){ renderPushCard(); return; }
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64(VAPID_PUBLIC)});
      const j=sub.toJSON();
      if(sb&&user&&j&&j.endpoint&&j.keys){
        await sb.from("push_subscriptions").upsert({client_email:user.email,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
      }
    }catch(e){}
    renderPushCard();
  }
  async function renderPushCard(){
    const el=$("pushCard"); if(!el)return;
    if(!user){ el.style.display="none"; return; }
    if(isIos()&&!isStandalone()){ el.style.display=""; el.innerHTML='<div class="push-tx">'+esc(T("pushIos"))+'</div>'; return; }
    if(!pushSupported()){ el.style.display="none"; return; }
    if(Notification.permission==="denied"){ el.style.display=""; el.innerHTML='<div class="push-tx">'+esc(T("pushDenied"))+'</div>'; return; }
    const sub=await currentPushSub();
    if(sub&&Notification.permission==="granted"){ el.style.display=""; el.innerHTML='<div class="push-tx push-ok">'+esc(T("pushEnabled"))+'</div>'; return; }
    el.style.display="";
    el.innerHTML='<div class="push-tx">'+esc(T("pushBody"))+'</div><button class="btn btn-primary btn-sm" id="pushOnBtn">'+esc(T("pushOn"))+'</button>';
  }
  document.addEventListener("click",e=>{ if(e.target&&e.target.id==="pushOnBtn") enablePush(); });
  $("notifClear").addEventListener("click",()=>{ notifs.forEach(n=>{ notifRead[n.id]=1; }); saveNotifState(); updateBadge(); renderNotifs(); });
  $("notifList").addEventListener("click",e=>{
    const row=e.target.closest(".nrow"); if(!row)return;
    const id=row.getAttribute("data-nid");
    if(e.target.closest('[data-nact="del"]')){ notifDeleted[id]=1; saveNotifState(); buildNotifs(); renderNotifs(); return; }
    notifRead[id]=1; saveNotifState(); updateBadge();

    else if(n&&n.type==="rem"){ $("notifPanel").classList.remove("open"); setView("schedule"); }
    renderNotifs();
  });

  $("gLogin").addEventListener("click", async ()=>{ const email=$("gEmail").value.trim(),pass=$("gPass").value; $("gErr").textContent=""; if(!email||!pass){ $("gErr").textContent=lang==="es"?"Escribe correo y contrase\u00f1a.":"Enter email and password."; return; } const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error){ $("gErr").textContent=lang==="es"?"No pudimos iniciar sesi\u00f3n. Revisa tus datos.":"We couldn't log you in. Check your details."; return; } location.reload(); });
  $("gPass").addEventListener("keydown",e=>{ if(e.key==="Enter")$("gLogin").click(); });

  applyLang(); boot();
})();
</script>
